[package]
name = "parvan"
version = "2.5.0"
edition = "2021"
authors = [
    "Ali Hasanifard <hasanifardalipa@gmail.com>",
    "Ehsan Fazlinejad",
    "Amirmahdi Shahbazi"
]
description = "Parvan Programming Language (ParvanLang) - Modern, fast, and elegant interpreted language implemented in Rust"
readme = "README.md"
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
colored = "2.1.0"
crossterm = "0.29.0"

[lib]
name = "parvan"
path = "src/lib.rs"

[[bin]]
name = "parvan"
path = "src/main.rs"
