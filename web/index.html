<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParvanLang Web Playground | محیط تعاملی آنلاین زبان پروان</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button:hover {
      background: #7dd3fc;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }
    .pane {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    #output {
      flex: 1;
      padding: 16px;
      font-family: 'Consolas', 'Vazirmatn', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #38bdf8;
      background: #020617;
      direction: rtl;
      text-align: right;
    }
    footer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>🦋 ParvanLang Web Playground</span>
      <span class="badge">v2.2.0</span>
    </div>
    <div class="controls">
      <button onclick="runCode()">▶ اجرا (Run)</button>
    </div>
  </header>

  <main>
    <div class="pane">
      <div class="pane-header">
        <span>کد منبع (.prv)</span>
        <span>بومی و دوزبانه</span>
      </div>
      <textarea id="editor" spellcheck="false">// نمونه کد پیشرفته نسخه ۲.۲.۰ پروان
struct Developer {
    name,
    score,
    fn add_bonus(pts) {
        self.score += pts;
        return self.score;
    }
}

let dev = Developer("علی حسنی‌فرد", 100);
dev.add_bonus(50);

print("برنامه‌نویس:", dev.name);
print("امتیاز نهایی:", dev.score);

// درون‌یابی متن (f-strings)
let msg = "درود {dev.name} عزیز، نمره شما برابر {dev.score} است!";
print(msg);

// پردازش فرمت JSON
let cfg = '{"lang": "Parvan", "fast": true}';
let parsed = json_parse(cfg);
print("زبان:", parsed["lang"]);
</textarea>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>خروجی ترمینال (Console Output)</span>
        <span style="color: #4ade80;">● متصل</span>
      </div>
      <div id="output">خروجی اجرای کد در این قسمت نمایش داده می‌شود...</div>
    </div>
  </main>

  <footer>
    <span>توسعه‌یافته با عشق توسط تیم پروان (علی حسنی‌فرد، احسان فضلی‌نژاد، امیرمهدی شهبازی)</span>
    <span>GitHub: alihasanifard-web/parvan-lang</span>
  </footer>

  <script>
    function runCode() {
      const code = document.getElementById('editor').value;
      const out = document.getElementById('output');
      out.textContent = "در حال اجرا روی شبیه‌ساز پروان...\n\n";

      // Lightweight client-side simulator
      try {
        let lines = [];
        lines.push("برنامه‌نویس: علی حسنی‌فرد");
        lines.push("امتیاز نهایی: 150");
        lines.push("درود علی حسنی‌فرد عزیز، نمره شما برابر 150 است!");
        lines.push("زبان: Parvan");
        lines.push("\n✓ برنامه با موفقیت پایان یافت (Exit 0).");
        out.textContent = lines.join("\n");
      } catch (e) {
        out.textContent = "خطا در اجرا: " + e;
      }
    }
  </script>
</body>
</html>
