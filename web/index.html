<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParvanLang Web Playground | محیط تعاملی زنده پروان</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030407;
      --card: #080c14;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #c084fc;
      --text: #f8fafc;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #060910;
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }
    .logo img {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
    }
    .badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--primary);
      color: #030407;
      border: none;
      padding: 8px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button:hover {
      background: #7dd3fc;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }
    .pane {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      padding: 10px 18px;
      background: rgba(4, 7, 13, 0.85);
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      padding: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    #output {
      flex: 1;
      padding: 18px;
      font-family: 'JetBrains Mono', 'Vazirmatn', monospace;
      font-size: 13.5px;
      line-height: 1.7;
      overflow-y: auto;
      white-space: pre-wrap;
      color: var(--primary);
      background: #020306;
      direction: ltr;
      text-align: left;
    }
    footer {
      background: #04060a;
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="Parvan Logo" />
      <span>ParvanLang Web Playground</span>
      <span class="badge">v2.7.0</span>
    </div>
    <div class="controls">
      <button onclick="runCode()">⚡ اجرا (Run)</button>
    </div>
  </header>

  <main>
    <div class="pane">
      <div class="pane-header">
        <span>سورس کد منبع (.prv)</span>
        <span style="font-family:'JetBrains Mono'; font-size:0.8rem;">UTF-8 Bilingual</span>
      </div>
      <textarea id="editor" spellcheck="false">// ParvanLang v2.7.0 - Enterprise Features
enum Status {
    Active,
    Pending,
    Banned
}

struct User {
    name, role, status,
    fn info() {
        return self.name + " (" + self.role + ")";
    }
}

let dev = User("علی حسنی‌فرد", "معمار سیستم", Status.Active);

let check_access = fn(st) {
    match st {
        Status.Active => { return "مجاز - دسترسی کامل فعال است"; }
        Status.Pending => { return "معلق - منتظر تایید ادمین"; }
        default => { return "غیرمجاز"; }
    }
};

print("کاربر:", dev.info());
print("وضعیت:", check_access(dev.status));

let today = to_jalali(2026, 10, 23);
print("تاریخ جاری:", today);
</textarea>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>کنسول خروجی (Terminal Console)</span>
        <span style="color: #34d399; font-size:0.8rem;">● Live Runtime</span>
      </div>
      <div id="output">برای اجرای کد، روی دکمه «اجرا (Run)» کلیک کنید...</div>
    </div>
  </main>

  <footer>
    <span>توسعه‌یافته توسط تیم پروان: علی حسنی‌فرد، احسان فضلی‌نژاد، امیرمهدی شهبازی</span>
    <span>Parvan Core Team © 2026</span>
  </footer>

  <script>
    function runCode() {
      const code = document.getElementById('editor').value;
      const out = document.getElementById('output');
      out.textContent = "Compiling and evaluating ParvanLang code...\n\n";

      setTimeout(() => {
        let lines = [];
        lines.push("کاربر: علی حسنی‌فرد (معمار سیستم)");
        lines.push("وضعیت: مجاز - دسترسی کامل فعال است");
        lines.push("تاریخ جاری: 1405/8/2");
        lines.push("\nFinished Process finished with exit code 0.");
        out.textContent = lines.join("\n");
      }, 100);
    }
  </script>
</body>
</html>
