<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Wing Neon Cyan Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Wing Purple Gradient -->
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4" />

  <!-- Hexagonal Tech Matrix Subtle Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <polygon points="256,40 380,112 380,256 256,328 132,256 132,112" />
    <polygon points="256,184 380,256 380,400 256,472 132,400 132,256" />
  </g>

  <!-- Parvan Butterfly (پروانه) Geometric Futuristic Insignia -->
  <g id="butterfly" filter="url(#neonGlow)">
    <!-- Left Upper Wing (Cyan Prism) -->
    <path d="M 244 240 L 110 106 C 80 140 70 210 130 270 L 244 256 Z" fill="url(#cyanNeon)" opacity="0.95" />
    
    <!-- Left Lower Wing (Purple Tech Dart) -->
    <path d="M 244 270 L 130 286 C 110 350 170 410 226 390 L 244 290 Z" fill="url(#purpleNeon)" opacity="0.85" />

    <!-- Right Upper Wing (Cyan Prism) -->
    <path d="M 268 240 L 402 106 C 432 140 442 210 382 270 L 268 256 Z" fill="url(#cyanNeon)" opacity="0.95" />
    
    <!-- Right Lower Wing (Purple Tech Dart) -->
    <path d="M 268 270 L 382 286 C 402 350 342 410 286 390 L 268 290 Z" fill="url(#purpleNeon)" opacity="0.85" />

    <!-- Center VM Core Stack / Butterfly Body -->
    <line x1="256" y1="130" x2="256" y2="390" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
    <circle cx="256" cy="120" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    
    <!-- Code Antennas -->
    <path d="M 252 110 Q 220 70 180 80" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 260 110 Q 292 70 332 80" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="180" cy="80" r="5" fill="#38bdf8" />
    <circle cx="332" cy="80" r="5" fill="#c084fc" />

    <!-- Inner Core Processor Spark -->
    <polygon points="256,220 272,256 256,292 240,256" fill="#ffffff" />
  </g>
</svg>
