<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Quantum Mesh Radial Base -->
    <radialGradient id="quantumBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="55%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Hyper Neon Cyan Wings (Multi-stop iridescent) -->
    <linearGradient id="cyanIridescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Electric Velvet Violet / Magenta -->
    <linearGradient id="velvetMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fae8ff" />
      <stop offset="30%" stop-color="#d946ef" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Pure Core White Hot Laser -->
    <linearGradient id="whiteLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Holographic Glass Specular Shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Multi-stage Bloom & Glow Filters -->
    <filter id="hyperBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blurWide" />
      <feGaussianBlur stdDeviation="6" result="blurTight" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45" result="aura" />
    </filter>
  </defs>

  <!-- Super-Squircle Curved App Icon Shield -->
  <rect width="1024" height="1024" rx="230" fill="url(#quantumBg)" stroke="#1e293b" stroke-width="6" />

  <!-- Background Quantum Ambient Lighting -->
  <g filter="url(#ambientAura)" opacity="0.6">
    <circle cx="340" cy="380" r="180" fill="#0284c7" />
    <circle cx="680" cy="380" r="180" fill="#9333ea" />
    <circle cx="512" cy="620" r="140" fill="#ec4899" />
  </g>

  <!-- Precision Cybernetic Coordinate Grid (Subtle Luxury) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="512" cy="512" r="420" fill="none" stroke-dasharray="8 12" />
    <circle cx="512" cy="512" r="280" fill="none" />
    <circle cx="512" cy="512" r="140" fill="none" stroke-dasharray="4 6" />
    <line x1="92" y1="512" x2="932" y2="512" />
    <line x1="512" y1="92" x2="512" y2="932" />
  </g>

  <!-- Central Futuristic Parvan Butterfly Masterpiece -->
  <g id="parvan-insignia" filter="url(#hyperBloom)">
    
    <!-- LEFT WINGS CLUSTER -->
    <!-- Primary Upper Left Wing (Prismatic Shard) -->
    <path d="M 488 470 L 210 190 C 130 270 120 420 250 540 L 488 510 Z" 
          fill="url(#cyanIridescent)" opacity="0.95" />
    <!-- Upper Left Wing Facet Overlay (Glass Gem Highlight) -->
    <path d="M 488 470 L 210 190 C 230 170 320 220 488 470 Z" 
          fill="url(#glassShine)" />
    <!-- Secondary Upper Left Wing Flap (Sharp Aero Fin) -->
    <path d="M 488 430 L 290 130 C 250 150 200 210 240 280 Z" 
          fill="#38bdf8" opacity="0.6" />

    <!-- Lower Left Wing (Velvet Magenta Propulsion Blade) -->
    <path d="M 488 540 L 250 580 C 200 710 320 830 440 790 L 488 590 Z" 
          fill="url(#velvetMagenta)" opacity="0.9" />
    <!-- Lower Left Internal Energy Vent -->
    <path d="M 488 555 L 320 610 C 300 680 370 740 430 730 Z" 
          fill="#f43f5e" opacity="0.5" />

    <!-- RIGHT WINGS CLUSTER (Mirrored Symmetry with Optical Perfection) -->
    <!-- Primary Upper Right Wing (Prismatic Shard) -->
    <path d="M 536 470 L 814 190 C 894 270 904 420 774 540 L 536 510 Z" 
          fill="url(#cyanIridescent)" opacity="0.95" />
    <!-- Upper Right Wing Facet Overlay -->
    <path d="M 536 470 L 814 190 C 794 170 704 220 536 470 Z" 
          fill="url(#glassShine)" />
    <!-- Secondary Upper Right Wing Flap -->
    <path d="M 536 430 L 734 130 C 774 150 824 210 784 280 Z" 
          fill="#38bdf8" opacity="0.6" />

    <!-- Lower Right Wing (Velvet Magenta Blade) -->
    <path d="M 536 540 L 774 580 C 824 710 704 830 584 790 L 536 590 Z" 
          fill="url(#velvetMagenta)" opacity="0.9" />
    <!-- Lower Right Internal Energy Vent -->
    <path d="M 536 555 L 704 610 C 724 680 654 740 594 730 Z" 
          fill="#f43f5e" opacity="0.5" />

    <!-- CORE SPINE & NEURAL VM BUS (The Needle of Pure Power) -->
    <line x1="512" y1="260" x2="512" y2="780" stroke="url(#whiteLaser)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Spinal Node Segments (Bytecode Stack Registers) -->
    <circle cx="512" cy="380" r="10" fill="#38bdf8" />
    <circle cx="512" cy="460" r="13" fill="#ffffff" />
    <circle cx="512" cy="540" r="15" fill="#f43f5e" />
    <circle cx="512" cy="620" r="11" fill="#c084fc" />

    <!-- Head: Diamond Reactor Core -->
    <polygon points="512,210 536,250 512,290 488,250" fill="#ffffff" />
    <circle cx="512" cy="250" r="6" fill="#38bdf8" />

    <!-- Cyber Antennas with Plasma Beacons -->
    <path d="M 500 230 Q 430 130 350 150" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M 524 230 Q 594 130 674 150" fill="none" stroke="#d946ef" stroke-width="8" stroke-linecap="round" />
    
    <!-- Antenna Beacon Orbs -->
    <circle cx="350" cy="150" r="14" fill="#a5f3fc" />
    <circle cx="350" cy="150" r="24" fill="#38bdf8" opacity="0.4" />
    <circle cx="674" cy="150" r="14" fill="#fae8ff" />
    <circle cx="674" cy="150" r="24" fill="#d946ef" opacity="0.4" />
  </g>

  <!-- Outer Glass Specular Sheen (Apple / macOS Pro Style Edge Lighting) -->
  <path d="M 230 6 Q 512 0 794 6 C 890 8 966 84 1000 180 C 850 320 600 400 230 370 C 100 360 40 280 24 180 C 58 84 134 8 230 6 Z" 
        fill="url(#glassShine)" opacity="0.75" />
</svg>
