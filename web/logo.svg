<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Dark Space Canvas Gradient -->
    <radialGradient id="canvasGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- Node Left: Pythonic Hyper-Cyan to Royal Blue Ribbon -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Right: Electric Magenta to Rust-Ember Violet Ribbon -->
    <linearGradient id="purpleRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Central Intersection Golden Spark -->
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Specular Highlight for Glassy Ribbon Feel -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow & Atmosphere Filters -->
    <filter id="dualAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="laserBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="bloom" />
      <feMerge>
        <feMergeNode in="bloom" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- macOS / iOS Rounded Squircle Base -->
  <rect width="1024" height="1024" rx="240" fill="url(#canvasGradient)" stroke="#1e293b" stroke-width="5" />

  <!-- Ambient Light Orbs (Cyan + Magenta Fusion) -->
  <g filter="url(#dualAura)" opacity="0.65">
    <circle cx="360" cy="440" r="190" fill="#0284c7" />
    <circle cx="660" cy="440" r="190" fill="#9333ea" />
    <circle cx="512" cy="620" r="130" fill="#f43f5e" />
  </g>

  <!-- Subtle Engineering Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="512" cy="512" r="380" fill="none" stroke-dasharray="6 10" />
    <circle cx="512" cy="512" r="220" fill="none" />
    <line x1="160" y1="512" x2="864" y2="512" />
    <line x1="512" y1="160" x2="512" y2="864" />
  </g>

  <!-- THE MASTER MONOGRAM EMBLEM: 'P' + BUTTERFLY + INFINITY INTERLOCK -->
  <g id="parvan-core" filter="url(#laserBloom)">

    <!-- BACK LAYER: Lower Wings / Ribbons (Infinity Flow) -->
    <!-- Left Lower Loop -->
    <path d="M 512 512 C 430 630 240 760 210 610 C 180 480 370 420 512 512 Z" 
          fill="url(#purpleRibbon)" opacity="0.88" />
    <!-- Right Lower Loop -->
    <path d="M 512 512 C 594 630 784 760 814 610 C 844 480 654 420 512 512 Z" 
          fill="url(#cyanRibbon)" opacity="0.88" />

    <!-- MID LAYER: Upper Butterfly Wings that sculpted the letter 'P' -->
    <!-- Left Wing / Stem of 'P' (Swift Aerodynamic Ribbon) -->
    <path d="M 440 220 C 320 220 200 340 220 500 C 240 640 430 790 500 810 L 524 740 C 470 710 320 590 310 490 C 300 400 370 300 460 300 Z" 
          fill="url(#cyanRibbon)" />
    <!-- Left Wing Glass Shimmer -->
    <path d="M 440 220 C 320 220 200 340 220 500 C 228 420 290 320 440 220 Z" 
          fill="url(#specularGlint)" />

    <!-- Right Wing / The Loop of 'P' (Interlocking like Python's Dual Serpents) -->
    <path d="M 480 220 C 660 190 830 290 810 470 C 790 620 620 680 490 640 L 504 560 C 600 590 710 540 720 450 C 730 350 630 280 490 290 Z" 
          fill="url(#purpleRibbon)" />
    <!-- Right Wing Glass Shimmer -->
    <path d="M 480 220 C 660 190 830 290 810 470 C 770 360 670 270 480 220 Z" 
          fill="url(#specularGlint)" />

    <!-- FOREGROUND: The Fusion Node (Python-like Eye Beacons) -->
    <!-- Cyan Energy Eye -->
    <circle cx="370" cy="360" r="22" fill="#ffffff" />
    <circle cx="370" cy="360" r="14" fill="#38bdf8" />
    <!-- Magenta Energy Eye -->
    <circle cx="650" cy="510" r="22" fill="#ffffff" />
    <circle cx="650" cy="510" r="14" fill="#f43f5e" />

    <!-- Center VM Power Spark (The Quantum Butterfly Heart) -->
    <polygon points="512,470 534,512 512,554 490,512" fill="#ffffff" />
    <circle cx="512" cy="512" r="6" fill="#38bdf8" />

    <!-- Cyber Antennas / Code Prompt Indicator `>` -->
    <path d="M 470 250 Q 420 150 340 160" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <path d="M 540 240 Q 610 140 690 170" fill="none" stroke="#c084fc" stroke-width="9" stroke-linecap="round" />
    <circle cx="340" cy="160" r="12" fill="#38bdf8" />
    <circle cx="690" cy="170" r="12" fill="#f43f5e" />
  </g>

  <!-- Sleek Apple Glass Surface Lighting Reflection -->
  <path d="M 240 6 Q 512 0 784 6 C 890 8 966 84 1000 180 C 850 320 580 390 240 370 C 110 360 40 280 24 180 C 58 84 134 8 240 6 Z" 
        fill="url(#specularGlint)" opacity="0.6" />
</svg>
